name: intelli_attend_faculty
description: IntelliAttend-Faculty Mobile App - Professional attendance management for faculty.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intelli_attend_shared:
    path: packages/intelli_attend_shared
  cupertino_icons: ^1.0.2
  dio: ^5.3.3
  provider: ^6.0.5
  shared_preferences: ^2.2.1
  local_auth: ^2.1.8
  mobile_scanner: ^3.5.2
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  file_picker: ^10.3.10
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.1.2
  vibration: ^2.0.1
  syncfusion_flutter_charts: ^26.1.35
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.0.0
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0
  crypto: ^3.0.3
  flutter_badge_manager: ^0.3.2
  flutter_timezone: ^5.0.0
  timezone: ^0.9.4
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  pdf: ^3.12.0
  excel: ^4.0.6
  csv: ^6.0.0
  printing: ^5.13.4
  record: ^7.0.0
  audioplayers: ^6.0.0
  video_player: ^2.9.0
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_square.png"

flutter_native_splash:
  color: "#050505"
  image: "assets/images/logo_square.png"
  android_12:
    color: "#050505"
    image: "assets/images/logo_square.png"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

